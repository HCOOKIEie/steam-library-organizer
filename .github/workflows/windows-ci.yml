name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONNOUSERSITE: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up CPython 3.13.2 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.2"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Verify Python runtime
        shell: pwsh
        run: >-
          python -c "import platform, struct, sys;
          assert sys.implementation.name == 'cpython';
          assert sys.version_info[:3] == (3, 13, 2), sys.version;
          assert struct.calcsize('P') * 8 == 64;
          print(sys.executable, sys.version, platform.machine())"

      - name: Install locked dependencies
        shell: pwsh
        run: >-
          python -m pip install
          --disable-pip-version-check
          --only-binary=:all:
          --no-binary=proxy_tools
          --no-input
          -r requirements-lock.txt

      - name: Check dependency graph
        run: python -m pip check

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python modules
        run: >-
          python -m py_compile
          steam_modern.py
          steam_desktop.py
          steam_settings.py
          steam_appinfo.py
          steam_library_core.py
          steam_web.py

      - name: Set up Node.js for UI regression tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install UI test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check JavaScript and UI behavior
        run: |
          npm run check
          npm test

      - name: Build frozen one-directory smoke package
        shell: pwsh
        env:
          SLO_BUILD_MODE: onedir
          SLO_VERSION_FILE: scripts\SteamLibraryOrganizer.version.txt
        run: >-
          python -I -m PyInstaller
          --noconfirm
          --clean
          --distpath .ci-dist
          --workpath .ci-build
          scripts\SteamLibraryOrganizer.spec

      - name: Verify frozen runtime resources
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD '.ci-dist\SteamLibraryOrganizer'
          $required = @(
            'SteamLibraryOrganizer.exe',
            '_internal\python313.dll',
            '_internal\VCRUNTIME140.dll',
            '_internal\_tkinter.pyd',
            '_internal\steam_ui\index.html',
            '_internal\steam_ui\styles.css',
            '_internal\steam_ui\p3r.css',
            '_internal\steam_ui\p5r.css',
            '_internal\steam_ui\fonts\BarlowCondensed-BlackItalic.ttf',
            '_internal\steam_ui\fonts\OFL-BarlowCondensed.txt',
            '_internal\steam_ui\fonts\Anton-Regular.ttf',
            '_internal\steam_ui\fonts\OFL-Anton.txt',
            '_internal\steam_ui\theme-bootstrap.js',
            '_internal\steam_ui\appearance.js',
            '_internal\steam_ui\app.js',
            '_internal\steam_ui\vault.js',
            '_internal\steam_ui\persona-motion.js',
            '_internal\steam_ui\persona-motion.css',
            '_internal\steam_ui\calm.css',
            '_internal\steam_ui\calm.js',
            '_internal\steam_ui\art\p3r-profile.webp',
            '_internal\steam_ui\art\p5r-profile.webp',
            '_internal\steam_ui\vault.css',
            '_internal\webview\lib\Microsoft.Web.WebView2.Core.dll',
            '_internal\webview\lib\Microsoft.Web.WebView2.WinForms.dll',
            '_internal\webview\lib\runtimes\win-arm64\native\WebView2Loader.dll',
            '_internal\webview\lib\runtimes\win-x64\native\WebView2Loader.dll',
            '_internal\webview\lib\runtimes\win-x86\native\WebView2Loader.dll'
          )
          $missing = @($required | Where-Object {
            -not (Test-Path -LiteralPath (Join-Path $bundle $_) -PathType Leaf)
          })
          if ($missing.Count -gt 0) {
            throw "Frozen package is missing required runtime files: $($missing -join ', ')"
          }
          Write-Host "Verified $($required.Count) frozen runtime files."
